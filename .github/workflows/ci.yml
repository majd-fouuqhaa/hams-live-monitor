name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium for browser tests
        run: vp exec playwright install --with-deps chromium

      - name: Verify mock server is unchanged
        run: echo "8a75b13b6dc48eff695850ec9958a6d5ca14a67bf0de81a7596d6adf815d2c6d  mock/mock-server.mjs" | sha256sum -c -

      # Format + lint + type check, RTL guard, unit + browser tests, production build.
      - run: vp run verify
